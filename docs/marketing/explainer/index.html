<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuietJar - Support, without the detour</title>
    <style>
      @font-face {
        font-family: "Caveat";
        src: url("assets/fonts/Caveat.ttf") format("truetype");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Kalam";
        src: url("assets/fonts/Kalam-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      @font-face {
        font-family: "Schibsted Grotesk";
        src: url("assets/fonts/SchibstedGrotesk-VariableFont.woff2") format("woff2");
        font-weight: 400 900;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/JetBrainsMono-VariableFont.woff2") format("woff2");
        font-weight: 100 800;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14201c;
        font-family: "Schibsted Grotesk", system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .stage {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border: 0;
        background: rgba(20, 32, 28, 0.35);
        color: #fbf8f1;
        font: 700 22px "Schibsted Grotesk", sans-serif;
        cursor: pointer;
      }
      .play span {
        padding: 18px 34px;
        border-radius: 999px;
        background: #0b6b3a;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 5px;
        background: rgba(20, 32, 28, 0.15);
        cursor: pointer;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #0b6b3a;
      }
      body.render .play,
      body.render .bar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="film" width="1920" height="1080"></canvas>
      <button class="play" id="play" type="button"><span>Play</span></button>
      <div class="bar" id="bar"><i></i></div>
    </div>
    <audio id="audio" src="build/soundtrack.mp3" preload="auto"></audio>

    <script src="build/timeline.js"></script>
    <script src="src/score.js"></script>
    <script src="src/engine.js"></script>
    <script src="src/props.js"></script>
    <script src="src/scenes.js"></script>
    <script>
      const canvas = document.getElementById("film");
      const ctx = canvas.getContext("2d");
      const audio = document.getElementById("audio");
      const playBtn = document.getElementById("play");
      const bar = document.getElementById("bar");
      const rendering = new URLSearchParams(location.search).has("render");
      if (rendering) document.body.classList.add("render");

      window.qjReady = (async () => {
        await Promise.all([
          document.fonts.load("700 40px Caveat"),
          document.fonts.load("700 40px Kalam"),
          document.fonts.load("400 40px 'Schibsted Grotesk'"),
          document.fonts.load("800 40px 'Schibsted Grotesk'"),
          document.fonts.load("500 40px 'JetBrains Mono'"),
        ]);
        QJ.init(ctx);
        QJ.setup(window.QJ_TIMELINE);
        QJ.render(ctx, 0);
        return QJ.A.total;
      })();

      window.qjRenderAt = (t) => QJ.render(ctx, t);

      if (!rendering) {
        const total = () => QJ.A.total;
        const tick = () => {
          const t = audio.currentTime;
          QJ.render(ctx, t);
          bar.firstElementChild.style.width = `${(t / total()) * 100}%`;
          if (!audio.paused) requestAnimationFrame(tick);
        };
        playBtn.addEventListener("click", async () => {
          await window.qjReady;
          if (audio.ended) audio.currentTime = 0;
          playBtn.style.display = "none";
          await audio.play();
          requestAnimationFrame(tick);
        });
        canvas.addEventListener("click", () => {
          audio.pause();
          playBtn.style.display = "";
        });
        audio.addEventListener("ended", () => {
          playBtn.firstElementChild.textContent = "Play again";
          playBtn.style.display = "";
        });
        bar.addEventListener("click", async (e) => {
          await window.qjReady;
          const r = bar.getBoundingClientRect();
          audio.currentTime = ((e.clientX - r.left) / r.width) * total();
          QJ.render(ctx, audio.currentTime);
          bar.firstElementChild.style.width = `${(audio.currentTime / total()) * 100}%`;
        });
      }
    </script>
  </body>
</html>
